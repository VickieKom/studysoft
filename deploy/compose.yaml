# Local stand and CI: PostgreSQL only for now. The application runs on the
# host during development; its image and the staging stack arrive with #4.
name: studysoft

services:
  db:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: studysoft
      POSTGRES_PASSWORD: studysoft
      POSTGRES_DB: studysoft
    ports:
      # Loopback only: the database is never reachable from the network.
      - "127.0.0.1:${DB_PORT:-54329}:5432"
    volumes:
      # Since 18 the image keeps data in a versioned subdirectory of this path.
      # The volume name carries the major version: a new major starts on an
      # empty volume instead of refusing to read the old one.
      - db-data-18:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U studysoft -d studysoft"]
      interval: 2s
      timeout: 3s
      retries: 30

volumes:
  db-data-18:
